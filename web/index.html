<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Dubhe · 天枢</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" fill="currentColor"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55" transform="rotate(-28 12 12)"/>
          <circle cx="20.2" cy="7.6" r="1.6" fill="currentColor"/>
        </svg>
        <span>天枢</span>
      </div>
      <button id="newChat" class="new-btn" title="新对话">＋</button>
    </div>
    <div id="convList" class="conv-list"></div>
    <div class="side-foot">
      <button id="openApi" class="side-item">
        <span class="si-icon">⇄</span><span>API 网关</span>
      </button>
      <button id="openSettings" class="side-item">
        <span class="si-icon">⚙</span><span>设置</span>
      </button>
      <div class="hw" id="hwInfo"></div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <button id="toggleSidebar" class="icon-btn" title="会话列表">☰</button>
      <div class="title-wrap">
        <div class="title" id="convTitle">新对话</div>
        <button class="model-chip" id="modelChip">未加载模型</button>
      </div>
      <button id="openSettings2" class="icon-btn" title="设置">⚙</button>
    </header>

    <div id="messages" class="messages">
      <div class="empty" id="emptyState">
        <div class="empty-logo">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4" fill="currentColor"/><ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5" transform="rotate(-28 12 12)"/></svg>
        </div>
        <h1>天枢 Dubhe</h1>
        <p>本地推理，数据不出设备</p>
        <div class="chips">
          <button class="chip" data-p="用三句话解释什么是本地大模型推理引擎">解释本地推理</button>
          <button class="chip" data-p="帮我写一个 Python 快速排序，并解释时间复杂度">写段代码</button>
          <button class="chip" data-p="把这句话翻译成英文：这个模型完全运行在我的笔记本上">翻译一句</button>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer" id="composer">
        <button class="composer-btn" id="btnTools" title="启用工具调用">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-5.6 5.6a1.4 1.4 0 0 0 2 2l5.6-5.6a4 4 0 0 0 5.4-5.4l-2.2 2.2-2-2 2.2-2.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="发消息…" enterkeyhint="send"></textarea>
        <button class="send-btn" id="send" title="发送">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M12 5l-6 6M12 5l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="hint" id="hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </main>
</div>

<!-- 设置 / API 面板 -->
<div class="sheet-mask hidden" id="mask"></div>
<div class="sheet hidden" id="sheet">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <button class="sheet-cancel" id="sheetClose">关闭</button>
    <div class="sheet-title" id="sheetTitle">设置</div>
    <button class="sheet-done" id="sheetSave">完成</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
