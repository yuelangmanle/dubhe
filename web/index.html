<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Dubhe · 天枢</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>

<!-- 图标集
     全部手绘矢量，统一 24 格、1.7 描边、圆头圆角。
     为什么不用 emoji 或生图模型：
       · emoji 在安卓和 iOS 上字形完全不同，⚙ 在部分安卓 ROM 上还是彩色的
       · 位图图标在 2x/3x 屏会糊，而且无法用 currentColor 跟随主题
       · 生图出的是位图，每个图标要单独抽卡，风格还压不齐
     用 <symbol> + <use>：一处定义、多处复用、无闪烁、可换色。
-->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">

  <!-- 品牌标识：行星 + 环 + 卫星。
       环分两段画：整条在行星后面，再把下半弧盖到前面 ——
       这样环是"绕着"行星的，而不是"贴在"后面。这一个细节决定了它是图标还是插画。
       原来的双轨道版本在 27px 下第二条会糊成脏影，已去掉。 -->
  <symbol id="i-logo" viewBox="0 0 24 24">
    <ellipse cx="12" cy="12" rx="9.6" ry="3.5" fill="none" stroke="currentColor"
             stroke-width="1.35" opacity=".55" transform="rotate(-26 12 12)"/>
    <circle cx="12" cy="12" r="4" fill="currentColor"/>
    <path d="M21.6 12A9.6 3.5 0 0 1 2.4 12" fill="none" stroke="currentColor"
          stroke-width="1.45" opacity=".95" stroke-linecap="round"
          transform="rotate(-26 12 12)"/>
    <circle cx="20.4" cy="7.9" r="1.6" fill="currentColor"/>
  </symbol>

  <symbol id="i-menu" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M3.5 7.5h17"/><path d="M3.5 12h17"/><path d="M3.5 16.5h13"/>
    </g>
  </symbol>

  <symbol id="i-plus" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
      <path d="M12 5.2v13.6"/><path d="M5.2 12h13.6"/>
    </g>
  </symbol>

  <!-- 设置：滑杆。20px 下齿轮会糊成一团，滑杆辨识度更高 -->
  <symbol id="i-settings" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M3.5 7.5h8.5"/><path d="M17.5 7.5h3"/>
      <path d="M3.5 16.5h3"/><path d="M12 16.5h8.5"/>
    </g>
    <circle cx="14.8" cy="7.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <circle cx="9.3" cy="16.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
  </symbol>

  <!-- API 网关：双向交换 -->
  <symbol id="i-swap" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8.5h15"/><path d="M15.5 5l3.5 3.5-3.5 3.5"/>
      <path d="M20 15.5H5"/><path d="M8.5 12L5 15.5 8.5 19"/>
    </g>
  </symbol>

  <symbol id="i-paperclip" viewBox="0 0 24 24">
    <path d="M10.2 13.4l5.4-5.4a3.1 3.1 0 1 1 4.4 4.4l-7.6 7.6a5.2 5.2 0 1 1-7.4-7.4l7-7"
          fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 工具调用：终端。比扳手更贴合"读文件 / 执行命令" -->
  <symbol id="i-terminal" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4.5" width="18" height="15" rx="3.2"/>
      <path d="M7.5 10l2.6 2.2-2.6 2.2"/>
      <path d="M12.8 14.6h4"/>
    </g>
  </symbol>

  <symbol id="i-arrow-up" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.1"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5.5"/><path d="M12 5.5L6 11.5"/><path d="M12 5.5l6 6"/>
    </g>
  </symbol>

  <symbol id="i-stop" viewBox="0 0 24 24">
    <rect x="6.5" y="6.5" width="11" height="11" rx="2.6" fill="currentColor"/>
  </symbol>

  <symbol id="i-bolt" viewBox="0 0 24 24">
    <path d="M13.3 2.6L4.7 13.4h5.4l-.9 8 8.7-10.8h-5.4z"
          fill="currentColor" stroke="currentColor" stroke-width=".7"
          stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-x" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M6.4 6.4l11.2 11.2"/><path d="M17.6 6.4L6.4 17.6"/>
    </g>
  </symbol>

  <symbol id="i-audio" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M3.6 11v2"/><path d="M7.3 7.5v9"/><path d="M11 3.5v17"/>
      <path d="M14.7 7.5v9"/><path d="M18.4 10v4"/><path d="M20.4 11.2v1.6"/>
    </g>
  </symbol>

  <symbol id="i-video" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.8" y="5.5" width="13.4" height="13" rx="3.2"/>
      <path d="M16.2 11l4.4-2.6v7.2L16.2 13z"/>
    </g>
  </symbol>

  <symbol id="i-file" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/>
      <path d="M13.5 3v5.5H19"/>
    </g>
  </symbol>

  <symbol id="i-image" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4.5" width="18" height="15" rx="3.2"/>
      <circle cx="8.6" cy="10" r="1.7"/>
      <path d="M3.6 17.2l4.6-4.2 4 3.4 3.2-2.8 5 4.4"/>
    </g>
  </symbol>

  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M4.5 12.8l4.7 4.7L19.5 7" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<div id="app">
  <div class="scrim" id="scrim"></div>
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logo"/></svg>
        <span>天枢</span>
      </div>
      <button id="newChat" class="new-btn" title="新对话" aria-label="新对话">
        <svg class="i" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
      </button>
    </div>
    <div id="convList" class="conv-list"></div>
    <div class="side-foot">
      <button id="openApi" class="side-item">
        <span class="si-icon"><svg class="i" viewBox="0 0 24 24"><use href="#i-swap"/></svg></span>
        <span>API 网关</span>
      </button>
      <button id="openSettings" class="side-item">
        <span class="si-icon"><svg class="i" viewBox="0 0 24 24"><use href="#i-settings"/></svg></span>
        <span>设置</span>
      </button>
      <div class="hw" id="hwInfo"></div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <button id="toggleSidebar" class="icon-btn" title="会话列表" aria-label="会话列表">
        <svg class="i" viewBox="0 0 24 24"><use href="#i-menu"/></svg>
      </button>
      <div class="title-wrap">
        <div class="title" id="convTitle">新对话</div>
        <button class="model-chip" id="modelChip">未加载模型</button>
      </div>
      <button id="openSettings2" class="icon-btn" title="设置" aria-label="设置">
        <svg class="i" viewBox="0 0 24 24"><use href="#i-settings"/></svg>
      </button>
    </header>

    <div id="messages" class="messages">
      <div class="empty" id="emptyState">
        <div class="empty-logo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logo"/></svg>
        </div>
        <h1>天枢 Dubhe</h1>
        <p>本地推理，数据不出设备</p>
        <div class="chips">
          <button class="chip" data-p="用三句话解释什么是本地大模型推理引擎">解释本地推理</button>
          <button class="chip" data-p="帮我写一个 Python 快速排序，并解释时间复杂度">写段代码</button>
          <button class="chip" data-p="把这句话翻译成英文：这个模型完全运行在我的笔记本上">翻译一句</button>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="attach-bar hidden" id="attachBar"></div>
      <div class="composer" id="composer">
        <button class="composer-btn" id="btnAttach" title="添加图片 / 音频 / 视频" hidden aria-label="添加附件">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-paperclip"/></svg>
        </button>
        <button class="composer-btn" id="btnTools" title="启用工具调用" aria-label="启用工具调用">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-terminal"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="发消息…" enterkeyhint="send"></textarea>
        <button class="send-btn" id="send" title="发送" aria-label="发送">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-arrow-up"/></svg>
        </button>
      </div>
      <div class="hint" id="hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </main>
</div>

<!-- 设置 / API 面板 -->
<div class="sheet-mask hidden" id="mask"></div>
<div class="sheet hidden" id="sheet">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <button class="sheet-cancel" id="sheetClose">关闭</button>
    <div class="sheet-title" id="sheetTitle">设置</div>
    <button class="sheet-done" id="sheetSave">完成</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<input type="file" id="fileInput" hidden>
<script src="/app.js"></script>
</body>
</html>
