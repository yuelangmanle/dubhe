<link rel="stylesheet" href="/app.css">
<!--
  图标分三档，因为一个 SVG 撑不住所有尺寸：
    favicon.svg     16–32px  两个元素（一个环 + 一个点），多一笔就成脏点
    icon-sm.svg      ≤96px   两道环、粗描边、星芒放大
    icon.svg        ≥128px   完整三道环 + 边缘高光
  PNG 是给不吃 SVG 的环境兜底（Safari 的 apple-touch-icon、部分安卓壳）。
-->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
</head>

<!-- ============================================================
     图标集
     全部手绘矢量，统一 24 格、1.7 描边、圆头圆角、纯 currentColor。
     为什么不用 emoji 或位图：
       · emoji 在安卓和 iOS 上字形完全不同，⚙ 在部分安卓 ROM 上还是彩色的
       · 位图在 2x/3x 屏会糊，而且无法跟随主题色
       · 生图出的是位图，每个图标要单独抽卡，风格压不齐
     用 <symbol> + <use>：一处定义、多处复用、无闪烁、可换色。
     ============================================================ -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">

  <!-- ---------- 品牌标识 ----------
       和 App 图标（web/icon.svg）同一个标记：四角星芒 + 两道交叉轨道。
       一个产品不能有两个 logo，所以界面里的标识必须是图标的简化版，不能是另一个东西。

       24 格下只留两道轨道 —— 第三道在这个尺寸是噪声（和小尺寸图标同一个判断）。
       几何从 1024 版等比缩下来：星芒半径 226/512 → 6.2，主环 342×126 → 7.8×2.9，
       次环 146×342 → 3.3×7.8，旋转角都保持 -24°。
       星芒比等比放大了一档（等比是 5.4）—— 单色下星是实心深色、环是浅描边，
       等比缩下来会读成"环里嵌了颗钻石"，星必须比环更有分量。

       和 App 图标有一处故意的不同：这里环画在星芒**后面**。
       App 图标里星是白的、环是青的，环压在星上读作"绕着"；但界面标识是单色的，
       环和星同色，压在星上会把四个尖角直接抹掉 —— 96px 下糊成一团深色块。
       单色只能靠剪影：星在前、环在后，轨道从四个尖角之间露出来。 -->

    <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
      <ellipse cx="12" cy="12" rx="7.8" ry="2.9" transform="rotate(-24 12 12)" opacity=".6"/>
      <ellipse cx="12" cy="12" rx="3.3" ry="7.8" transform="rotate(-24 12 12)" opacity=".4"/>
    </g>
    <path d="M12 5.8 C12.27 10.46 13.54 11.73 18.2 12
             C13.54 12.27 12.27 13.54 12 18.2
             C11.73 13.54 10.46 12.27 5.8 12

  </symbol>

      <path d="M12 19V5.5"/><path d="M12 5.5L6 11.5"/><path d="M12 5.5l6 6"/>
    </g>
  </symbol>

  <symbol id="i-split" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.2" y="4.4" width="17.6" height="15.2" rx="2.6"/>
      <path d="M14.2 4.4v15.2"/>
    </g>
  </symbol>

  <symbol id="i-paperclip" viewBox="0 0 24 24">
    <path d="M10.2 13.4l5.4-5.4a3.1 3.1 0 1 1 4.4 4.4l-7.6 7.6a5.2 5.2 0 1 1-7.4-7.4l7-7"
          fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-bolt" viewBox="0 0 24 24">
    <path d="M13.3 2.6L4.7 13.4h5.4l-.9 8 8.7-10.8h-5.4z"
          fill="currentColor" stroke="currentColor" stroke-width=".7"
          stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M4.5 12.8l4.7 4.7L19.5 7" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<!-- ============================================================
     背景：山脊 + 光晕 + 噪点
     三层山脊用极低对比的 SVG 画，不用照片 —— 照片会把注意力从内容上抢走，
     而且换主题时压不住色。山脊只是给玻璃面板一个"背后有东西"的理由。
     ============================================================ -->
<div class="backdrop" aria-hidden="true">
  <div class="sky"></div>
  <svg class="ridge ridge-1" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
    <path d="M0 500 C60 470 110 482 160 450 C210 418 250 430 290 380
             C330 330 355 288 382 248 C408 288 432 342 470 382
             C510 422 560 412 610 442 C660 472 700 460 742 420
             C782 382 820 350 860 310 C898 272 930 282 962 322
             C992 362 1032 402 1082 432 C1132 462 1182 450 1232 472
             C1282 492 1342 480 1440 502 L1440 900 L0 900Z"/>
  </svg>
  <svg class="ridge ridge-2" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
    <path d="M0 640 C80 610 150 622 220 590 C290 558 340 518 400 478
             C450 444 500 470 552 510 C604 550 662 546 722 520
             C782 494 842 448 900 418 C952 392 1002 420 1052 460
             C1102 500 1162 530 1222 546 C1292 562 1362 550 1440 572
             L1440 900 L0 900Z"/>
  </svg>
  <svg class="ridge ridge-3" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
    <path d="M0 762 C100 732 182 746 262 720 C342 694 422 648 502 628
             C572 610 642 640 712 666 C782 692 862 680 942 650
             C1012 624 1082 642 1152 672 C1232 706 1322 700 1440 722
             L1440 900 L0 900Z"/>
  </svg>
</div>

<!-- ============================================================
     工作台：三栏
     左 = 导航与会话，中 = 对话，右 = 运行状态。
     三块都是独立浮起的玻璃板，中间留缝 —— 这样"三个功能区"在视觉上
     就是三件事，而不是一整块被竖线切开的白板。
     ============================================================ -->
<div id="app" class="desk">
  <div class="scrim" id="scrim"></div>

  <!-- ------------------------------ 左：导航 ------------------------------ -->
  <aside id="sidebar" class="pane nav">
    <div class="nav-head">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logo"/></svg>
        <div class="brand-txt">
          <div class="brand-line"><b>天枢</b><i>Dubhe</i></div>
          <em>本地大模型推理引擎</em>
        </div>
      </div>
      <button id="navClose" class="icon-btn xs" title="收起" aria-label="收起导航">
        <svg class="i" viewBox="0 0 24 24"><use href="#i-x"/></svg>
      </button>
    </div>

    <div class="search">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" placeholder="搜索对话、模型或文件" aria-label="搜索">
      <kbd>⌘K</kbd>
    </div>

    <nav class="nav-list" id="navList">
      <button class="nav-item on" data-view="chat">
        <span class="ni"><svg class="i" viewBox="0 0 24 24"><use href="#i-chat"/></svg></span>
        <span>对话</span>
      </button>
      <button class="nav-item" data-view="models">
        <span class="ni"><svg class="i" viewBox="0 0 24 24"><use href="#i-cube"/></svg></span>
        <span>模型</span>
      </button>
      <button class="nav-item" data-view="translate">
        <span class="ni"><svg class="i" viewBox="0 0 24 24"><use href="#i-globe"/></svg></span>
        <span>翻译</span>
      </button>
      <button class="nav-item" data-view="tools">
        <span class="ni"><svg class="i" viewBox="0 0 24 24"><use href="#i-nodes"/></svg></span>
        <span>工具</span>
      </button>
      <button class="nav-item" id="openApi">
        <span class="ni"><svg class="i" viewBox="0 0 24 24"><use href="#i-api"/></svg></span>
        <span>API 服务</span>
      </button>
      <button class="nav-item" data-view="agent">
        <span class="ni"><svg class="i" viewBox="0 0 24 24"><use href="#i-agent"/></svg></span>
        <span>Agent</span>
      </button>
      <button class="nav-item" data-view="files">
        <span class="ni"><svg class="i" viewBox="0 0 24 24"><use href="#i-folder"/></svg></span>
        <span>文件</span>
      </button>
      <button class="nav-item" data-view="kb">
        <span class="ni"><svg class="i" viewBox="0 0 24 24"><use href="#i-book"/></svg></span>
        <span>知识库</span>
      </button>
      <button class="nav-item" data-view="memory">
        <span class="ni"><svg class="i" viewBox="0 0 24 24"><use href="#i-think"/></svg></span>
        <span>记忆</span>
      </button>
    </nav>

    <div class="nav-sep"></div>

    <div class="nav-group">
      <div class="nav-group-head">
        <span>工作空间</span>
        <button id="newChat" class="icon-btn xs" title="新对话" aria-label="新对话">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
        </button>
      </div>
      <div id="convList" class="conv-list"></div>
    </div>

    <div class="nav-foot">
      <div class="res-row">
        <span>本地资源</span>
        <b id="resTxt">—</b>
      </div>
      <div class="res-bar"><i id="resBar"></i></div>
      <div class="hw" id="hwInfo"></div>
      <button id="openSettings" class="nav-item">
        <span class="ni"><svg class="i" viewBox="0 0 24 24"><use href="#i-settings"/></svg></span>
        <span>设置</span>
      </button>
    </div>
  </aside>

  <!-- ------------------------------ 中：对话 ------------------------------ -->
  <main class="pane chat">
    <header class="chat-head">
      <button id="toggleSidebar" class="icon-btn only-narrow" title="会话列表" aria-label="会话列表">
        <svg class="i" viewBox="0 0 24 24"><use href="#i-menu"/></svg>
      </button>

      <button class="model-pick" id="modelChip" title="切换模型">
        <span class="mp-badge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logo"/></svg>
        </span>
        <span class="mp-name" id="mpName">未加载模型</span>
        <span class="mp-tags" id="mpTags"></span>
        <svg class="i mp-caret" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron"/></svg>
      </button>

      <div class="live" id="liveBadge"><i></i><span class="live-p">本地运行 · </span><span class="live-s">未连接</span></div>

      <!-- 项目文件夹：本对话的工具以它为根。点一下可以换。
           做成常驻可见的小胶囊而不是藏进设置，是因为"模型读的到底是
           哪个目录"这件事必须一眼可见 —— 否则它读到别的项目的文件，
           用户只会觉得模型在胡说。 -->
      <button id="cwdChip" class="cwd-chip" title="本对话的项目文件夹">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-folder"/></svg>
        <span id="cwdName">未绑定</span>
      </button>

      <div class="chat-actions">
        <button id="toggleInspector" class="icon-btn" title="运行状态" aria-label="运行状态">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-split"/></svg>
        </button>
        <button id="newChat2" class="icon-btn" title="新对话" aria-label="新对话">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
        </button>
        <button id="openSettings2" class="icon-btn" title="设置" aria-label="设置">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-dots"/></svg>
        </button>
      </div>
      <div id="convTitle" class="sr-only">新对话</div>
    </header>

    <div id="messages" class="messages">
      <div class="empty" id="emptyState">
        <div class="empty-logo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logo"/></svg>
        </div>
        <h1>天枢 Dubhe</h1>
        <p>本地推理，数据不出设备</p>
        <div class="chips">
          <button class="chip" data-p="用三句话解释什么是本地大模型推理引擎">解释本地推理</button>
          <button class="chip" data-p="帮我写一个 Python 快速排序，并解释时间复杂度">写段代码</button>
          <button class="chip" data-p="把这句话翻译成英文：这个模型完全运行在我的笔记本上">翻译一句</button>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="attach-bar hidden" id="attachBar"></div>
      <div class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="输入问题，或拖入文件、图片、视频…" enterkeyhint="send"></textarea>
        <div class="composer-bar">
          <button class="cbtn sq" id="btnAttach" title="添加附件" aria-label="添加附件" hidden>
            <svg class="i" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
          </button>
          <button class="cbtn" id="btnFile" title="文件">
            <svg class="i" viewBox="0 0 24 24"><use href="#i-msg-file"/></svg><span>文件</span>
          </button>
          <button class="cbtn" id="btnImage" title="图像">
            <svg class="i" viewBox="0 0 24 24"><use href="#i-upload-image"/></svg><span>图像</span>
          </button>
          <button class="cbtn" id="btnThink" title="显示模型的推理过程（关闭只是不显示，模型仍会推理）" aria-pressed="false">
            <svg class="i" viewBox="0 0 24 24"><use href="#i-think"/></svg><span>思考过程</span>
          </button>
          <button class="cbtn dim" id="btnWeb" disabled title="联网搜索未开启">
            <svg class="i" viewBox="0 0 24 24"><use href="#i-globe"/></svg><span>联网搜索</span>
          </button>
          <span class="grow"></span>
          <button class="cbtn sq" id="btnTools" title="工具调用" aria-label="工具调用">
            <svg class="i" viewBox="0 0 24 24"><use href="#i-terminal"/></svg>
          </button>
          <button class="cbtn dim" id="btnMic" disabled title="语音输入未启用" aria-label="语音输入">
            <svg class="i" viewBox="0 0 24 24"><use href="#i-mic"/></svg>
          </button>
          <button class="cmode" id="btnMode">
            <span>智能模式</span> <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron"/></svg>
          </button>
          <button class="send-btn" id="send" title="发送" aria-label="发送">
            <svg class="i" viewBox="0 0 24 24"><use href="#i-send"/></svg>
          </button>
        </div>
      </div>
      <div class="hint" id="hint">Enter 发送 · Shift+Enter 换行</div>
    </div>

    <!-- 侧栏切过来的功能视图。盖在对话区上而不是替换 DOM：
         对话的滚动位置、草稿、流式状态全在原位，切回来一点不丢。 -->
    <section id="views" class="views" hidden>
      <header class="view-head">
        <button class="icon-btn xs" id="viewBack" title="返回对话" aria-label="返回对话">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
        </button>
        <h2 id="viewTitle">模型</h2>
        <span class="view-sub" id="viewSub"></span>
        <span class="grow"></span>
        <div class="view-actions" id="viewActions"></div>
      </header>
      <div class="view-body" id="viewBody"></div>
    </section>
  </main>

  <!-- ------------------------------ 右：运行状态 ------------------------------ -->
  <aside id="inspector" class="pane insp">
    <section class="block">
      <div class="block-head">
        <h3>运行状态</h3>
        <button class="icon-btn xs" id="inspClose" title="收起" aria-label="收起">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-x"/></svg>
        </button>
      </div>

      <div class="gauge-row">
        <div class="gauge">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#9DBFAE"/>
                <stop offset="100%" stop-color="#2E4238"/>
              </linearGradient>
            </defs>
            <circle class="gauge-track" cx="60" cy="60" r="50"/>
            <circle class="gauge-fill" id="gaugeFill" cx="60" cy="60" r="50"
                    stroke-dasharray="314" stroke-dashoffset="314"/>
          </svg>
          <div class="gauge-val">
            <b id="gTps">—</b>
            <i>tok/s</i>
          </div>
        </div>
        <div class="gauge-stats">
          <div><span>已生成</span><b id="gTok">0</b></div>
          <div><span>总用时</span><b id="gTime">—</b></div>
          <div><span>首字延迟</span><b id="gTtft">—</b></div>
        </div>
      </div>

      <div class="meters" id="meters"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <h3>模型信息</h3>
        <button class="icon-btn xs" id="modelInfoBtn" aria-label="模型详情">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
        </button>
      </div>
      <div class="model-card">
        <div class="mc-head">
          <svg class="mc-mark" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logo"/></svg>
          <b id="mcName">未加载</b>
          <span class="tag" id="mcTag">空闲</span>
        </div>
        <div class="kv-stack" id="modelKv"></div>
      </div>
    </section>

    <section class="block">
      <div class="block-head">
        <h3>工具调用 <span class="count" id="toolCount">0</span></h3>
        <button class="icon-btn xs" aria-label="更多">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-dots"/></svg>
        </button>
      </div>
      <div class="tool-list" id="toolList">
        <div class="tool-empty">本轮对话还没有调用工具</div>
      </div>
    </section>

    <section class="block">
      <div class="block-head">
        <h3>系统日志</h3>
        <button class="icon-btn xs" id="copyLog" title="复制日志" aria-label="复制日志">
          <svg class="i" viewBox="0 0 24 24"><use href="#i-copy"/></svg>
        </button>
      </div>
      <pre class="log" id="logBox"></pre>
    </section>
  </aside>
</div>

<!-- 设置 / API 面板 -->
<div class="sheet-mask hidden" id="mask"></div>
<div class="sheet hidden" id="sheet">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <button class="sheet-cancel" id="sheetClose">关闭</button>
    <div class="sheet-title" id="sheetTitle">设置</div>
    <button class="sheet-done" id="sheetSave">完成</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<input type="file" id="fileInput" hidden>
<script src="/app.js"></script>
</body>
</html>
